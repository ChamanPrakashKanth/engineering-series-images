<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="800" viewBox="0 0 1400 800" role="img" aria-labelledby="title desc"><title id="title">Defense radar thermal-management loop</title><desc id="desc">Diagram showing a radar array, cold plate, coolant pump, heat exchanger and thermal monitoring controller.</desc><defs><marker id="a" markerWidth="12" markerHeight="12" refX="9" refY="6" orient="auto"><path d="M0 0L12 6L0 12Z" fill="#42d6ff"/></marker><linearGradient id="bg" x2="0" y2="1"><stop stop-color="#0b1d32"/><stop offset="1" stop-color="#132e48"/></linearGradient></defs><rect width="1400" height="800" rx="30" fill="url(#bg)"/><text x="700" y="70" fill="#f5f8ff" font-family="Arial,sans-serif" font-size="38" text-anchor="middle" font-weight="700">Defense Radar Thermal-Management Architecture</text><rect x="85" y="210" width="310" height="200" rx="18" fill="#193d5b" stroke="#58c8f2" stroke-width="4"/><text x="240" y="255" fill="#fff" font-family="Arial" font-size="28" text-anchor="middle" font-weight="700">AESA radar array</text><g fill="#ff9f43" stroke="#ffe4b8" stroke-width="2"><rect x="130" y="290" width="40" height="50" rx="5"/><rect x="190" y="290" width="40" height="50" rx="5"/><rect x="250" y="290" width="40" height="50" rx="5"/><rect x="310" y="290" width="40" height="50" rx="5"/></g><text x="240" y="380" fill="#cad9e8" font-family="Arial" font-size="20" text-anchor="middle">distributed RF heat sources</text><rect x="470" y="250" width="220" height="125" rx="18" fill="#204c6c" stroke="#42d6ff" stroke-width="4"/><text x="580" y="300" fill="#fff" font-family="Arial" font-size="25" text-anchor="middle" font-weight="700">Cold plate</text><text x="580" y="337" fill="#cad9e8" font-family="Arial" font-size="18" text-anchor="middle">conductive interface</text><rect x="790" y="250" width="190" height="125" rx="18" fill="#204c6c" stroke="#42d6ff" stroke-width="4"/><text x="885" y="300" fill="#fff" font-family="Arial" font-size="25" text-anchor="middle" font-weight="700">Pump + valves</text><text x="885" y="337" fill="#cad9e8" font-family="Arial" font-size="18" text-anchor="middle">flow control</text><rect x="1080" y="210" width="235" height="200" rx="18" fill="#193d5b" stroke="#58c8f2" stroke-width="4"/><text x="1197" y="260" fill="#fff" font-family="Arial" font-size="25" text-anchor="middle" font-weight="700">Heat exchanger</text><path d="M1120 300h155M1120 330h155M1120 360h155" stroke="#ff9f43" stroke-width="8"/><text x="1197" y="390" fill="#cad9e8" font-family="Arial" font-size="18" text-anchor="middle">platform heat sink</text><path d="M395 310H460M690 310H780M980 310H1070" fill="none" stroke="#42d6ff" stroke-width="8" marker-end="url(#a)"/><path d="M1195 420V570H585V390" fill="none" stroke="#42d6ff" stroke-width="8" marker-end="url(#a)"/><text x="860" y="550" fill="#8fe6ff" font-family="Arial" font-size="20" text-anchor="middle">coolant return — monitor temperature, pressure and flow</text><rect x="460" y="620" width="480" height="95" rx="16" fill="#173650" stroke="#86d998" stroke-width="3"/><text x="700" y="660" fill="#fff" font-family="Arial" font-size="24" text-anchor="middle" font-weight="700">Thermal controller + health monitoring</text><text x="700" y="692" fill="#cad9e8" font-family="Arial" font-size="18" text-anchor="middle">derate safely • detect faults • log configuration</text><path d="M580 620V510H240V420M820 620V500H885V390" fill="none" stroke="#86d998" stroke-width="4" stroke-dasharray="10 10" marker-end="url(#a)"/><text x="70" y="765" fill="#9fb5c9" font-family="Arial" font-size="17">Conceptual engineering diagram — not a specific fielded system</text></svg>