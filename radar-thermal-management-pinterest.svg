<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 1200" role="img" aria-labelledby="t d"><title id="t">Radar thermal management engineering infographic</title><desc id="d">Portrait infographic showing radar array heat loads, cooling loop, heat exchanger and monitoring feedback.</desc><rect width="900" height="1200" fill="#f2f6fb"/><rect x="36" y="36" width="828" height="1128" rx="30" fill="white" stroke="#233d59" stroke-width="8"/><text x="450" y="115" text-anchor="middle" font-family="Arial" font-size="42" font-weight="bold" fill="#142a43">RADAR THERMAL</text><text x="450" y="170" text-anchor="middle" font-family="Arial" font-size="33" font-weight="bold" fill="#27618d">MANAGEMENT LOOP</text><g font-family="Arial" text-anchor="middle"><rect x="140" y="245" width="620" height="170" rx="22" fill="#dceafa" stroke="#285781" stroke-width="5"/><text x="450" y="310" font-size="35" font-weight="bold" fill="#142a43">ARRAY / RF MODULES</text><text x="450" y="365" font-size="25" fill="#142a43">Distributed electrical losses → local hot spots</text><path d="M450 420v90" stroke="#243c56" stroke-width="12"/><path d="m430 490 20 25 20-25" fill="#243c56"/><rect x="140" y="530" width="620" height="170" rx="22" fill="#e2f2e8" stroke="#39714d" stroke-width="5"/><text x="450" y="595" font-size="35" font-weight="bold" fill="#142a43">COLD PLATE + COOLANT</text><text x="450" y="650" font-size="25" fill="#142a43">Flow, contact resistance, pump and leak risks</text><path d="M450 705v90" stroke="#243c56" stroke-width="12"/><path d="m430 775 20 25 20-25" fill="#243c56"/><rect x="140" y="815" width="620" height="170" rx="22" fill="#fff0d8" stroke="#a36a18" stroke-width="5"/><text x="450" y="880" font-size="35" font-weight="bold" fill="#142a43">PLATFORM HEAT SINK</text><text x="450" y="935" font-size="25" fill="#142a43">Air / seawater / fuel interfaces and constraints</text><path d="M450 990v80" stroke="#243c56" stroke-width="12"/><path d="m430 1050 20 25 20-25" fill="#243c56"/><text x="450" y="1125" font-size="25" font-weight="bold" fill="#27618d">SENSE → TREND → DERATE / SERVICE</text></g></svg>