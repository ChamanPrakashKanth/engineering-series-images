<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 1100" role="img" aria-labelledby="t d"><title id="t">Shipboard electromagnetic compatibility design path</title><desc id="d">Conceptual shipboard EMC diagram connecting equipment emitters, cable routes, bonding, receivers, testing and corrective design.</desc><rect width="900" height="1100" fill="#f2f6fa"/><rect x="35" y="35" width="830" height="1030" rx="26" fill="#fff" stroke="#1f3d5b" stroke-width="8"/><text x="450" y="105" text-anchor="middle" font-family="Arial" font-size="38" font-weight="bold" fill="#173652">SHIPBOARD EMC</text><text x="450" y="155" text-anchor="middle" font-family="Arial" font-size="25" fill="#38719a">Integration is an installation property</text><g font-family="Arial" text-anchor="middle"><rect x="105" y="220" width="300" height="145" rx="18" fill="#f8e7df" stroke="#a15135" stroke-width="4"/><text x="255" y="275" font-size="27" font-weight="bold">EMITTERS</text><text x="255" y="320" font-size="20">switching / RF equipment</text><rect x="495" y="220" width="300" height="145" rx="18" fill="#e4edf7" stroke="#315d87" stroke-width="4"/><text x="645" y="275" font-size="27" font-weight="bold">CABLE PATHS</text><text x="645" y="320" font-size="20">routing / separation / shielding</text><rect x="105" y="460" width="300" height="145" rx="18" fill="#e4f1e8" stroke="#43744e" stroke-width="4"/><text x="255" y="515" font-size="27" font-weight="bold">BONDING</text><text x="255" y="560" font-size="20">interfaces / return paths</text><rect x="495" y="460" width="300" height="145" rx="18" fill="#f5f0db" stroke="#8c7a29" stroke-width="4"/><text x="645" y="515" font-size="27" font-weight="bold">SUSCEPTIBLE LOADS</text><text x="645" y="560" font-size="20">receivers / control / sensors</text><path d="M405 293h70M255 365v80M645 365v80M405 533h70" stroke="#273c50" stroke-width="7"/><rect x="160" y="715" width="580" height="135" rx="18" fill="#e9e2f5" stroke="#654c89" stroke-width="4"/><text x="450" y="770" font-size="27" font-weight="bold">MEASURE IN REPRESENTATIVE CONFIGURATION</text><text x="450" y="815" font-size="20">operating modes • installed cables • documented setup</text><path d="M450 605v95" stroke="#273c50" stroke-width="7"/><path d="m430 685 20 22 20-22" fill="#273c50"/><text x="450" y="925" font-size="22" font-weight="bold" fill="#173652">Identify coupling → verify → correct → re-test</text><text x="450" y="985" font-size="17" fill="#4b5968">Conceptual engineering illustration; not platform-specific wiring data</text></g></svg>