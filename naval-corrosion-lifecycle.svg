<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 1100" role="img" aria-labelledby="t d"><title id="t">Naval corrosion control lifecycle</title><desc id="d">Diagram connecting seawater exposure, material and joint design, coating system, inspection findings, maintenance action and trend records.</desc><rect width="900" height="1100" fill="#f3f7fa"/><rect x="35" y="35" width="830" height="1030" rx="26" fill="white" stroke="#264157" stroke-width="7"/><text x="450" y="105" text-anchor="middle" font-family="Arial" font-size="40" font-weight="bold" fill="#163652">NAVAL CORROSION CONTROL</text><text x="450" y="155" text-anchor="middle" font-family="Arial" font-size="24" fill="#4b6579">A lifecycle loop—not just a coat of paint</text><g font-family="Arial" text-anchor="middle"><rect x="175" y="225" width="550" height="125" rx="18" fill="#dceaf5" stroke="#2e648e" stroke-width="4"/><text x="450" y="275" font-size="28" font-weight="bold">EXPOSURE</text><text x="450" y="318" font-size="21">salt • moisture • temperature • crevices</text><path d="M450 355v56" stroke="#32495d" stroke-width="7"/><path d="m430 395 20 22 20-22" fill="#32495d"/><rect x="175" y="425" width="550" height="125" rx="18" fill="#f5e9d6" stroke="#997137" stroke-width="4"/><text x="450" y="475" font-size="28" font-weight="bold">DESIGN / MATERIALS</text><text x="450" y="518" font-size="21">dissimilar metals • drainage • access</text><path d="M450 555v56" stroke="#32495d" stroke-width="7"/><path d="m430 595 20 22 20-22" fill="#32495d"/><rect x="175" y="625" width="550" height="125" rx="18" fill="#e1f0e5" stroke="#46764e" stroke-width="4"/><text x="450" y="675" font-size="28" font-weight="bold">PRESERVATION</text><text x="450" y="718" font-size="21">surface prep • coating • sealing</text><path d="M450 755v56" stroke="#32495d" stroke-width="7"/><path d="m430 795 20 22 20-22" fill="#32495d"/><rect x="175" y="825" width="550" height="125" rx="18" fill="#efe5f4" stroke="#705387" stroke-width="4"/><text x="450" y="875" font-size="28" font-weight="bold">INSPECT / MAINTAIN / LEARN</text><text x="450" y="918" font-size="21">record condition • repair • update plan</text><path d="M175 890H100V285H165" fill="none" stroke="#32495d" stroke-width="7"/><path d="m145 265 22 20-22 20" fill="#32495d"/><text x="450" y="1000" font-size="19" fill="#465c70">Use approved platform procedures and compatible materials</text></g></svg>