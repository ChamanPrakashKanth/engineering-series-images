<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="1400" viewBox="0 0 1000 1400"><rect width="1000" height="1400" fill="#081827"/><text x="500" y="100" fill="#f4f8fb" text-anchor="middle" font-family="Arial" font-size="44" font-weight="bold">SHIPBOARD CORROSION CONTROL</text><text x="500" y="154" fill="#9cc8dc" text-anchor="middle" font-family="Arial" font-size="26">A lifecycle engineering loop</text><g font-family="Arial" text-anchor="middle"><rect x="120" y="260" width="760" height="190" rx="24" fill="#12364b" stroke="#40bfd1" stroke-width="4"/><text x="500" y="325" fill="#fff" font-size="34" font-weight="bold">1 · DESIGN &amp; MATERIALS</text><text x="500" y="380" fill="#d4e6ee" font-size="25">Drainage · isolation · compatible alloys</text><rect x="120" y="515" width="760" height="190" rx="24" fill="#12364b" stroke="#40bfd1" stroke-width="4"/><text x="500" y="580" fill="#fff" font-size="34" font-weight="bold">2 · PROTECT THE SURFACE</text><text x="500" y="635" fill="#d4e6ee" font-size="25">Coating system · preparation · cure control</text><rect x="120" y="770" width="760" height="190" rx="24" fill="#12364b" stroke="#40bfd1" stroke-width="4"/><text x="500" y="835" fill="#fff" font-size="34" font-weight="bold">3 · INSPECT &amp; TREND</text><text x="500" y="890" fill="#d4e6ee" font-size="25">Locations · condition · repeatable records</text><rect x="120" y="1025" width="760" height="190" rx="24" fill="#12364b" stroke="#40bfd1" stroke-width="4"/><text x="500" y="1090" fill="#fff" font-size="34" font-weight="bold">4 · REPAIR &amp; LEARN</text><text x="500" y="1145" fill="#d4e6ee" font-size="25">Restore protection · find cause · update plan</text></g><text x="500" y="1310" fill="#83a9ba" text-anchor="middle" font-family="Arial" font-size="21">CONTROL THE EXPOSURE, NOT JUST THE RUST</text></svg>