<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 620" role="img" aria-labelledby="t d"><title id="t">Defense vehicle cooling reliability loop</title><desc id="d">Conceptual armored-vehicle cooling system showing radiator, fan, engine, coolant pump, sensors, and maintenance feedback.</desc><rect width="1200" height="620" fill="#f3f6fa"/><text x="600" y="58" text-anchor="middle" font-family="Arial" font-size="34" font-weight="bold" fill="#13243a">DEFENSE VEHICLE COOLING: DESIGN FOR DUST, LOAD &amp; SERVICE</text><g font-family="Arial" font-size="22" text-anchor="middle"><rect x="70" y="200" width="210" height="145" rx="18" fill="#dce9f7" stroke="#244e76" stroke-width="4"/><text x="175" y="260">Engine /</text><text x="175" y="293">power unit</text><rect x="365" y="200" width="210" height="145" rx="18" fill="#e3f0e8" stroke="#3e7150" stroke-width="4"/><text x="470" y="260">Coolant</text><text x="470" y="293">pump</text><rect x="660" y="200" width="210" height="145" rx="18" fill="#fff0d8" stroke="#a36a18" stroke-width="4"/><text x="765" y="260">Radiator +</text><text x="765" y="293">fan pack</text><rect x="955" y="200" width="180" height="145" rx="18" fill="#f4e2e2" stroke="#8e3c3c" stroke-width="4"/><text x="1045" y="260">Dust /</text><text x="1045" y="293">airflow</text><path d="M280 270H350M575 270H645M870 270H940" stroke="#263b50" stroke-width="8"/><path d="M470 365V465H175V365" fill="none" stroke="#263b50" stroke-width="7"/><text x="320" y="510">return loop</text><rect x="300" y="120" width="580" height="55" rx="12" fill="#172d46"/><text x="590" y="156" fill="white">Sensors → trend limits → inspection / service action</text><path d="M470 200V175M765 200V175" stroke="#263b50" stroke-width="5"/><text x="600" y="575" font-size="18" fill="#334">Conceptual system diagram — not a vehicle-specific maintenance procedure</text></g></svg>